name: API CI / CD & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Validate TypeScript Compilation
        run: npx tsc --noEmit

      - name: Verify Clean Architecture Boundaries (Linter)
        run: node scripts/verify-architecture.js

  test-e2e:
    name: Core Workflow E2E Integration Suite
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: worksauto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run E2E Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/worksauto_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_super_secret_jwt_key_2026_worksauto_e2e_pass"
          NODE_ENV: "development"
          ENABLE_DEV_OTP_BYPASS: "true"
        run: |
          npx prisma db push --skip-generate
          npm run test:e2e

  build:
    name: Production Build Verification
    needs: [lint-and-typecheck, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build API
        run: npm run build

  deploy-production:
    name: Production Deployment Gate (Manual Approval)
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Secrets
        id: check_secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          if [ -n "$PROD_HOST" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Gate Notice
        if: steps.check_secrets.outputs.has_secrets != 'true'
        run: |
          echo "ℹ️ PROD_HOST secret is not configured in GitHub Secrets."
          echo "✅ Continuous Integration & Build verification completed with 100% PASS."

      - name: Deploy to Production Server via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            cd /opt/worksauto/worksauto-api
            git pull origin main
            npm ci --omit=dev
            npx prisma migrate deploy
            npm run build
            pm2 reload worksauto-api || pm2 start dist/main.js --name worksauto-api

